[project]
name = "algolens-pipeline"
version = "0.1.0"
description = "AlgoLens offline pipeline: ingest real Indian market data, run strategies, export JSON"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26",
  "pyarrow>=15",
  "yfinance>=0.2.50",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "scipy>=1.12",
  "requests>=2.31",
  "kagglehub>=0.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
